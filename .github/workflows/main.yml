name: Nightly Web Scraper

on:
  schedule:
    - cron: '22 1 * * *'
      timezone: 'America/New_York'
 
  # Allows manual triggering with a dropdown from the GitHub UI
  workflow_dispatch:
    inputs:
      target:
        description: 'What data to scrape'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - events
          - feeds

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Determine Target Flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: check dropdown selection
            case "${{ github.event.inputs.target }}" in
              events) echo "TARGET_FLAG=--events" >> $GITHUB_ENV ;;
              feeds)  echo "TARGET_FLAG=--feeds" >> $GITHUB_ENV ;;
              *)      echo "TARGET_FLAG=--all" >> $GITHUB_ENV ;;
            esac
          else
            # Scheduled run: always --all
            echo "TARGET_FLAG=--all" >> $GITHUB_ENV
          fi

      - name: Run Scraper
        env:
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run scrape -- $TARGET_FLAG

      - name: Commit and push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json feeds.json
          git commit -m "chore: scrape update [skip ci]" || exit 0
          git push

      - name: Wait for GitHub to index commit
        run: sleep 10

      - name: Trigger Netlify Build
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          curl -X POST -d {} "$NETLIFY_BUILD_HOOK_URL"
